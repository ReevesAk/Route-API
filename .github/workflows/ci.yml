name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.10.1
      # Fails the build on any known vulnerability in the pinned runtime or dev dependencies.
      - run: pip-audit --strict --require-hashes --disable-pip -r requirements.txt
      - run: pip-audit --strict --require-hashes --disable-pip -r requirements-dev.txt

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: coverage run manage.py test
      - run: coverage report

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and start web + Redis
        run: docker compose up --build --detach --wait --wait-timeout 120
      - name: Health check reports Redis reachable
        run: |
          body=$(curl --fail --silent --show-error http://localhost:8000/api/health/)
          echo "$body"
          test "$body" = '{"status":"ok","cache":"ok"}'
      - name: Route endpoint validates input
        run: |
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H 'Content-Type: application/json' -d '{"origin":"Denver, CO"}' \
            http://localhost:8000/api/route/)
          test "$code" = 400
      - name: Logs
        if: always()
        run: docker compose logs
      - run: docker compose down
        if: always()
