[project]
name = "fuel-route-api"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["venv", "*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.isort]
known-first-party = ["fuel", "routing", "fuel_route_api"]

[tool.coverage.run]
source = ["fuel", "routing", "fuel_route_api"]
omit = ["*/migrations/*", "*/tests.py", "*/test_*.py", "fuel_route_api/asgi.py", "fuel_route_api/wsgi.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_empty = true
